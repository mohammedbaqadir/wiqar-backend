name = "wiqar-backend"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Secrets are set with `wrangler secret put SALLA_TOKEN` — never here.
# [vars]
# SALLA_APP_NAME = "wiqar-backend"
# SALLA_APP_VERSION = "0.1.0"

# Production keeps the store's tokens in KV so they survive restarts and the
# refresh rotation. Create the namespace once, then uncomment:
#   wrangler kv namespace create TOKENS
# [[kv_namespaces]]
# binding = "TOKENS"
# id = "paste the id wrangler prints"
